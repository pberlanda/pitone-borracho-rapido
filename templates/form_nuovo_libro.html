<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo libro</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container-fluid p-3 text-white text-center bg-primary">
        <h1 class="display-3">ah ecco!</h1>
    </div>

    <form class="container border mt-3" id="form-libro">

        <div class="container mt-3 mb-3">
            <label for="titolo">Titolo</label>
            <input class="w3-input" type="text" id="titolo" required>
        </div>

        <div class="container mb-3">
            <label for="autore">Autore</label>
            <input class="w3-input" type="text" id="autore" required>
        </div>

        <div class="container mb-3">
            <button class="btn btn-primart" type="submit">Invia</button>
        </div>
        
    </form>

    <div class="container"><p id="risultato">TEST</p></div>

    <div class="container mt-3 p-5 border"><p>kepei</p></div>

    <script>
        document.getElementById("form-libro").addEventListener('submit', async (e) => {
            e.preventDefault();

            const titolo = document.getElementById("titolo").value;
            const autore = document.getElementById("autore").value;

            const risposta =
            await fetch("/libri", {
                method: "POST",
                headers: {
                    "content-Type":"application/json"
                },
                body: JSON.stringify({
                    id:5,
                    titolo: titolo,
                    autore: autore
                })
            });

            const dati = await risposta.json();

            document.getElementById("risultato").textContent = JSON.stringify(dati);

        });
    </script>

</body>
</html>
