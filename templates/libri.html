<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Buchverwaltung</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
    <div class="container-fluid p-3 text-white text-center bg-primary"><h1>Die Buchverwaltung</h1></div>

    <div class="container mt-3">

        <div class="container">
            <div class="row">
                <div class="col">

                    <!-- <div class="container mt-3"><p class="lead">Sammlung der Bücher</p></div> -->
                    <p class="lead">Sammlung der Bücher</p>

                </div>

                <div class="col">
                    <ul class="nav justify-content-end">
                        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/form">Nuovo libro</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">link 3</a></li>
                    </ul>
                </div>

            </div>
        </div>

        
        <div class="row">
            <div class="col">

                <div class="table-responsive">
                    <table class="table table-bordered table-hover">

                        <thead class="table-light">
                            <tr>
                                <th>Id</th>
                                <th>Titolo</th>
                                <th>Autore</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>

                        <tbody id="tabella-libri"></tbody>

                    </table>
                </div>

            </div>
        </div>
    </div>

    <script>
        async function caricaLibri() {

            console.log("TEST Ok");

            const risposta = await fetch("/libri"); // chiama la route che legge i libri
            const libri = await risposta.json();    // cerca nell'oggetto resstituito il JSON (oggetto restitutio dalla route)

            const tabella = document.getElementById("tabella-libri"); // riferimento alla tabella

            // per ogni item dell'oggetto libri
            // con una arrow function creo un oggetto libro
            // creo una riga in cui compongo la riga della tabella
            // con l'interpolazione aggiungo i dati alla tabella 
		
        	// la sintassi con l'interpolazione é più figa, ma richiede lo stupido backtick. 
			// ci sono diverse shortcut per ottenerlo su Win o Mac/Linux
			// in alternativa si puo usare la meno elegante ma non meno efficace concatenzazione
			// "<td>" + libro.id + "</td>"


            libri.forEach(libro => {
                const riga = `

                <tr>
                    <td>${libro.id}</td>
                    <td>${libro.titolo}</td>
                    <td>${libro.autore}</td>
                    <td>
                        <a href="/delete/${libro.id}" class="btn btn-sm btn-danger" onClick="eliminaLibro();">Elimina</a>
                        <a href="/edit/${libro.id}" class="btn btn-sm btn-primary">Modifica</a>
                    </td>
                </tr>
                `;

                tabella.innerHTML += riga; // aggiungo la riga composta alla tabella

            });
        }

        caricaLibri();

        async function eliminaLibro(id) {

            const risposta = await fetch(`/delete/${id}`, { method: 'DELETE' });
            const risultato = await risposta.json();

            console.log(risultato);

            // Ricarica la tabella dei libri dopo l'eliminazione
            document.getElementById("tabella-libri").innerHTML = ""; // Pulisce la tabella
            
            caricaLibri(); // Ricarica i libri
        }

    </script>

</body>
</html>
