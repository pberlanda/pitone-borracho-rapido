<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo libro</title>
</head>
<body>
    <form id="form-libro">
        <label for="titolo">Titolo</label>
        <input type="text" id="titolo" required>
        <br>
        <label for="autore">Autore</label>
        <input type="text" id="autore" required>
        <br>
        <button type="submit">Invia</button>
    </form>

    <p id="risultato"></p>

    <script>
        document.getElementById("form-libro").addEventListener('submit', async (e) => {
            e.preventDefault();

            const titolo = document.getElementById("titolo").value;
            const autore = document.getElementById("autore").value;

            const risposta =
            await fetch("/libri", {
                method: "POST",
                headers: {
                    "content-Type":"application/json"
                },
                body: JSON.stringify({
                    id:5,
                    titolo: titolo,
                    autore: autore
                })
            });

            const dati = await risposta.json();

            document.getElementById("risultato").textContent = JSON.stringify(dati);

        });
    </script>

</body>
</html>
